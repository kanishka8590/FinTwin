services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fintwin
      POSTGRES_PASSWORD: fintwin
      POSTGRES_DB: fintwin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintwin"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports: ["5432:5432"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://fintwin:fintwin@postgres:5432/fintwin
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8000:8000"]
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes: [.:/app]
    command: sh -c "npm install && npm run dev"
    depends_on: [backend]
    ports: ["5173:5173"]
